name: Publish GitHub Pages runtime
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-public-web
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      COMPOSE_BAKE: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build dashboard inside the required devcontainer
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            cd /workspace/ui
            pnpm install --frozen-lockfile
            pnpm test -- src/components/PagesConnection.test.tsx src/lib/pagesService.test.ts
            GITHUB_PAGES=true pnpm run build
            cd /workspace/website
            npm ci --no-audit --no-fund
            GITHUB_PAGES=true npm run build
            cd /workspace
            python3 scripts/github-pages.py
      - name: Check out public runtime
        uses: actions/checkout@v4
        with:
          repository: allen7wang/skillshare-web
          ref: main
          path: _public-web
          ssh-key: ${{ secrets.WEB_PAGES_DEPLOY_KEY }}
      - name: Synchronize and publish
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' --exclude='README.md' --exclude='CNAME' dist-pages/ _public-web/
          git -C _public-web add --all
          if ! git -C _public-web diff --cached --quiet; then
            git -C _public-web -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish runtime from $GITHUB_SHA"
            git -C _public-web push origin HEAD:main
          fi
